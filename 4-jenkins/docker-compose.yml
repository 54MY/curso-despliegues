version: '3.8'
services:
    jenkins:
        image: custom-jenkins:1.0.0
        container_name: custom-jenkins
        build: .
        restart: always
        privileged: true
        user: root
        environment:
            DOCKER_API_VERSION: "1.43"
        ports:
            - 8080:8080
        volumes:
            - ./jenkins_configuration:/var/jenkins_home
            - /var/run/docker.sock:/var/run/docker.sock