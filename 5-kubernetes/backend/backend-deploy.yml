apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mi-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend:1.0.0
          ports:
            - containerPort: 3000
              name: backend
          env:
            - name: DB_HOST
              value: "db"
            - name: DB_USER
              value: "usuario"
            - name: DB_PASSWORD
              value: "password123"
            - name: DB_NAME
              value: "personas_db"
            - name: DB_PORT
              value: "3306"