version: "3.9"

services:
  postgres:
    container_name: postgres
    build:
      dockerfile: Dockerfile
      context: ./postgres
    image: custom/postgres:1.0.0-SNAPSHOT
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - demo-net

  app:
    container_name: app
    build:
      dockerfile: Dockerfile
      context: ./app
    image: custom/app:1.0.0-SNAPSHOT
    restart: always
    ports:
      - "9091:9091"
    depends_on:
      - postgres
    networks:
      - demo-net

volumes:
  postgres-data:

networks:
  demo-net:
    driver: bridge
