# Define a custom port instead of the default 8080
server.port=9091
##
## Security
##
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=ADMIN
##
## WS properties
##

##
## DataBase
## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
## Oracle settings
## HikariCP settings
##
spring.datasource.url=jdbc:postgresql://postgres:5432/demo
spring.datasource.hikari.username=user
spring.datasource.hikari.password=secret
spring.datasource.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=11
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
##
## MyBatis properties
##
# Mybatis entity scan packages
# The location of the mapper files
mybatis.mapper-locations=classpath*:/etc/mybatis/*Mapper.xml
