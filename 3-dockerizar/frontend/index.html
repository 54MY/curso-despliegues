<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Personas</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1f2428;
            --accent: #58a6ff;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --border: #30363d;
            --success: #3fb950;
            --warning: #f0883e;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        header h1::before {
            content: "$ ";
            color: var(--accent);
        }

        header p {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 300;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-weight: 400;
        }

        button {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 10px 20px;
            font-size: 0.85rem;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        button:hover {
            border-color: var(--accent);
            background: rgba(88, 166, 255, 0.1);
        }

        button:active {
            transform: scale(0.98);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .loading::before {
            content: "> ";
            color: var(--accent);
        }

        .loading::after {
            content: "_";
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .error {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--warning);
            padding: 20px;
            margin: 20px 0;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .error strong {
            color: var(--warning);
            display: block;
            margin-bottom: 8px;
        }

        .table-container {
            overflow-x: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        tbody tr {
            border-bottom: 1px solid var(--border);
            transition: background 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: var(--bg-tertiary);
        }

        td {
            padding: 14px 16px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }

        .id-column {
            color: var(--accent);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .email-column {
            color: var(--text-secondary);
            font-size: 0.8rem;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(88, 166, 255, 0.2);
            font-variant-numeric: tabular-nums;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            header h1 {
                font-size: 1.5rem;
            }

            .controls {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            table {
                font-size: 0.8rem;
            }

            th, td {
                padding: 10px;
            }

            th {
                font-size: 0.7rem;
            }
        }

        /* Minimal animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-container {
            animation: fadeIn 0.3s ease;
        }

        /* Code-like styling */
        .mono {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>db.personas.find()</h1>
            <p>MySQL Database Query Interface</p>
        </header>

        <div class="controls">
            <div class="status">
                <span class="status-indicator"></span>
                <span class="status-text mono" id="totalCount">0 records</span>
            </div>
            <button onclick="cargarPersonas()">refresh</button>
        </div>

        <div id="contenido">
            <div class="loading">connecting to database</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://backend:3001/api/personas';

        async function cargarPersonas() {
            const contenido = document.getElementById('contenido');
            contenido.innerHTML = '<div class="loading">querying records</div>';

            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const resultado = await response.json();
                
                if (resultado.success && resultado.data.length > 0) {
                    mostrarTabla(resultado.data);
                    document.getElementById('totalCount').textContent = `${resultado.total} records`;
                } else {
                    contenido.innerHTML = '<div class="error"><strong>query returned empty</strong>No records found in database.</div>';
                }
            } catch (error) {
                console.error('Error:', error);
                contenido.innerHTML = `
                    <div class="error">
                        <strong>connection failed</strong>
                        ${error.message}<br><br>
                        <small>ensure backend is running on http://backend:3001</small>
                    </div>
                `;
            }
        }

        function mostrarTabla(personas) {
            const html = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>id</th>
                                <th>nombre</th>
                                <th>apellido</th>
                                <th>edad</th>
                                <th>email</th>
                                <th>teléfono</th>
                                <th>ciudad</th>
                                <th>país</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${personas.map(persona => `
                                <tr>
                                    <td class="id-column mono">${persona.id.toString().padStart(3, '0')}</td>
                                    <td>${persona.nombre}</td>
                                    <td>${persona.apellido}</td>
                                    <td><span class="badge mono">${persona.edad}</span></td>
                                    <td class="email-column">${persona.email}</td>
                                    <td class="mono">${persona.telefono}</td>
                                    <td>${persona.ciudad}</td>
                                    <td>${persona.pais}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('contenido').innerHTML = html;
        }

        // Cargar datos al inicio
        cargarPersonas();
    </script>
</body>
</html>
